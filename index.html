<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fútbol Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --raised: #f8f9fb; --text: #16181d; --muted: #6b7280; --line: #e3e5e9;
    --accent: #c8102e; --follow-bg: #fdecef; --rival-bg: #f1f3f6; --chip: #eef0f4;
    --derby-bg: #fff6d1; --top-bg: #e6f0fd;
    --ok: #13834a; --ok-bg: #e3f5eb; --warn: #9a6200; --warn-bg: #fdf3dc;
    --bad: #b42318; --bad-bg: #fdeaea; --idle-bg: #eceef2; --live: #d92d20;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --lift: 0 10px 28px rgba(16, 24, 40, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1a1d23; --raised: #20242b; --text: #e8eaee; --muted: #9aa1ad; --line: #2b2f37;
      --accent: #ff4d63; --follow-bg: #3a1a20; --rival-bg: #22262d; --chip: #272b33;
      --derby-bg: #332b0f; --top-bg: #15263d;
      --ok: #4ad191; --ok-bg: #12301f; --warn: #f1c25b; --warn-bg: #352a10;
      --bad: #ff8a80; --bad-bg: #3a1716; --idle-bg: #262a31; --live: #ff6b5e;
      --shadow: none; --lift: 0 10px 28px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .spacer { flex: 1; }
  header small { color: var(--muted); }
  button { font: inherit; color: var(--text); background: var(--idle-bg); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { cursor: default; opacity: .6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 2px 7px; line-height: 1; background: transparent; border-color: transparent; color: var(--muted); }
  button.icon:hover { color: var(--text); border-color: var(--line); }
  button.icon.danger:hover { color: var(--bad); }
  input[type=text] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                     border-radius: 6px; padding: 6px 9px; width: 100%; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  section.bare { background: none; border: 0; padding: 0; }
  section[hidden] { display: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
  h3:first-child { margin-top: 0; }

  .logo { width: 20px; height: 20px; object-fit: contain; flex: none; vertical-align: middle; }
  .logo.sm { width: 16px; height: 16px; }
  .logo.md { width: 26px; height: 26px; }
  .logo.lg { width: 40px; height: 40px; }
  /* some competition logos are white (made for promiedos' dark header); outline them on light backgrounds */
  @media not (prefers-color-scheme: dark) { .logo.league { filter: drop-shadow(0 0 1px rgba(0, 0, 0, .55)); } }

  /* ----- team summary cards ----- */
  .team-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); align-items: start; }
  .team-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
               box-shadow: var(--shadow); border-top: 4px solid var(--team-color, var(--line)); }
  .team-card.dragging { box-shadow: var(--lift); opacity: .92; outline: 2px solid var(--accent); }
  .tc-head { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 4px; }
  .tc-head .grow { flex: 1; min-width: 0; }
  .tc-head .name { font-size: 16px; font-weight: 700; }
  .tc-head .sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .tc-head .players { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
  .drag { cursor: grab; touch-action: none; user-select: none; color: var(--muted); padding: 6px 4px; font-size: 15px; line-height: 1; opacity: .55; }
  .drag:hover { opacity: 1; }
  .dragging .drag { cursor: grabbing; }
  .collapse-btn { transition: transform .15s; }
  .team-card.collapsed .collapse-btn { transform: rotate(-90deg); }
  .pchip { font-size: 12px; color: var(--muted); }
  .pchip::before { content: "★ "; color: var(--warn); }
  .featured { margin: 0 10px 10px; padding: 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; }
  .comp { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
          text-transform: uppercase; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 2px 9px 2px 4px; max-width: 100%; }
  .comp > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp .round { font-weight: 500; text-transform: none; letter-spacing: 0; }
  .fixture { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .datebox { flex: none; text-align: center; min-width: 66px; padding: 4px 6px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
  .datebox .t { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; line-height: 1.2; }
  .datebox .d { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .datebox.today { border-color: var(--accent); }
  .datebox.today .d { color: var(--accent); font-weight: 600; }
  .opp { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; min-width: 0; }
  .opp .ha { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; width: 18px; }
  .tvs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; align-items: center; }
  .tvs::before { content: "📺"; font-size: 13px; margin-right: 2px; }
  .tv-pill { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); }
  .later { border-top: 1px solid var(--line); }
  .collapsed .later { border-top: 0; }
  .later-row { display: grid; grid-template-columns: 74px 20px minmax(0, 1fr); gap: 2px 10px; align-items: center;
               padding: 7px 14px; border-bottom: 1px solid var(--line); }
  .later-row:last-child { border-bottom: 0; }
  .later-row .when { grid-row: span 3; align-self: start; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
  .later-row .when b { color: var(--text); font-size: 13px; }
  .later-row .when.today { color: var(--accent); font-weight: 600; }
  .later-row .who { display: flex; align-items: center; gap: 6px; font-weight: 500; min-width: 0; }
  .later-row .who .ha { font-size: 11px; color: var(--muted); width: 16px; text-transform: uppercase; }
  .later-row .extra { grid-column: 3; font-size: 12px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .later-row .badges { grid-column: 3; margin-top: 2px; }
  .badges:empty { display: none; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
           background: var(--idle-bg); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.live { background: var(--live); color: #fff; }
  .positions { border-top: 1px solid var(--line); background: var(--raised); padding: 8px 14px; display: grid; gap: 4px; font-size: 12.5px; }
  .pos-line { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
  .pos-league { font-weight: 600; margin-right: 2px; }
  .pos-item { display: inline-flex; align-items: center; gap: 5px; }
  .pos-item + .pos-item { padding-left: 8px; border-left: 1px solid var(--line); }
  .pos-num { font-weight: 700; font-variant-numeric: tabular-nums; border-left: 3px solid transparent; padding-left: 4px; }
  /* section header bars for "My teams" / "Players": the whole bar toggles the section */
  .sec-toggle { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; margin: 0 0 12px;
                background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
                font-size: 15px; font-weight: 700; color: var(--text); text-align: left; box-shadow: var(--shadow); }
  .sec-toggle:hover { border-color: var(--muted); border-left-color: var(--accent); background: var(--raised); }
  .sec-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sec-toggle .count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 9px; }
  .sec-toggle .count:empty { display: none; }
  .sec-toggle .action { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .sec-toggle .action::before { content: "Hide"; }
  .sec-toggle .chev { display: inline-block; transition: transform .15s; }
  section.folded .sec-toggle { margin-bottom: 0; }
  section.folded .sec-toggle .action::before { content: "Show"; }
  section.folded .sec-toggle .chev { transform: rotate(-90deg); }
  section.folded .team-cards { display: none; }
  /* Matches by day / Next matches / Standings: the title folds the section down to its header */
  .fold-btn { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; box-shadow: none;
              font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
  .fold-btn:hover { color: var(--text); background: none; }
  .fold-btn .chev { display: inline-block; transition: transform .15s; }
  section.foldable.folded > :not(h2), section.foldable.folded h2 .controls { display: none; }
  section.foldable.folded h2 { margin-bottom: 0; }
  section.foldable.folded .fold-btn .chev { transform: rotate(-90deg); }
  .config-banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border-left: 4px solid var(--warn); background: var(--warn-bg); }
  .config-banner[hidden] { display: none; }
  .config-banner .actions { display: flex; gap: 8px; margin-left: auto; }
  .pos-player { color: var(--text); }
  .pos-player::before { content: "★ "; color: var(--warn); }
  .card-loading { padding: 0 14px 12px; color: var(--muted); }

  /* ----- competition chips + competition view ----- */
  .comp-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .comp-bar .label { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-right: 4px; font-weight: 600; }
  .comp-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px 3px 5px; background: var(--card); }
  .comp-chip:hover { border-color: var(--accent); }
  dialog.wide-dlg { width: min(1240px, calc(100vw - 24px)); }
  .comp-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .8fr); align-items: start; }
  @media (max-width: 1000px) { .comp-grid { grid-template-columns: minmax(0, 1fr); } }
  .comp-grid h4 { display: flex; align-items: center; gap: 6px; }
  .comp-grid h4 .grow { flex: 1; }
  .comp-grid .tables { grid-template-columns: minmax(0, 1fr); }
  .leaders + .leaders { margin-top: 16px; }
  .leaders table td.name { white-space: normal; }
  .leaders td.name span { display: inline-flex; align-items: center; gap: 6px; }

  /* ----- lists ----- */
  .day-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .day-nav .label { font-weight: 600; min-width: 120px; text-align: center; }
  .day-nav label { margin-left: auto; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  .game-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center;
              padding: 7px 8px; border-radius: 8px; }
  .game-row.with-day { grid-template-columns: 84px minmax(0, 1fr) auto; }
  .game-row + .game-row { margin-top: 2px; }
  .game-row.follow { background: var(--follow-bg); }
  .game-row.rival { background: var(--rival-bg); }
  /* Matches by day / Next matches only list your own matches (plus rivals): no highlight for yours,
     a thin divider between rows instead, and a faint tint plus left edge for rival matches */
  :is(#day, #next) .game-row { border-radius: 0; border-bottom: 1px solid var(--line); }
  :is(#day, #next) .game-row + .game-row { margin-top: 0; }
  :is(#day, #next) .game-row:last-child { border-bottom: 0; }
  :is(#day, #next) .game-row.follow { background: none; }
  :is(#day, #next) .game-row.rival { background: color-mix(in srgb, var(--rival-bg) 60%, transparent); box-shadow: inset 3px 0 0 var(--line); }
  /* standout matches: two followed teams against each other (yellow), or two top-3 teams (blue) */
  :is(#day, #next) .game-row.top3 { background: var(--top-bg); }
  :is(#day, #next) .game-row.derby { background: var(--derby-bg); }
  .game-row .when { color: var(--muted); font-size: 12px; line-height: 1.25; }
  .game-row .when b { color: var(--text); font-size: 13.5px; display: block; }
  .game-row .teams { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 500; }
  .game-row .teams .t { display: inline-flex; align-items: center; gap: 5px; }
  .game-row .teams .vs { color: var(--muted); font-size: 12px; }
  .game-row .score { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
                     display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .game-row .score .st { font-size: 12px; font-weight: 400; color: var(--muted); }
  .game-row .score .result { font-size: 20px; font-weight: 800; line-height: 1.1; letter-spacing: .02em; color: var(--text); }
  .game-row .score .result.live { color: var(--live); }
  /* goal summary: collapsed behind a small toggle, so the result stays the main thing on the row */
  .scorers-box { margin-top: 5px; }
  .scorers-box summary { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; list-style: none; font-size: 12px;
                         font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 9px; }
  .scorers-box summary::-webkit-details-marker { display: none; }
  .scorers-box summary::after { content: "▸"; transition: transform .15s; }
  .scorers-box[open] summary::after { transform: rotate(90deg); }
  .scorers-box summary:hover { color: var(--text); }
  .meta { color: var(--muted); font-size: 12px; }
  /* goal summary: an inset panel, one line per team that scored */
  .scorers { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 8px; align-items: baseline;
             margin-top: 6px; padding: 6px 9px; font-size: 12px; background: var(--card);
             border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 6px; }
  .scorers .side { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .scorers .side::before { content: "⚽"; font-size: 11px; }
  .scorers .list { display: flex; flex-wrap: wrap; gap: 1px 12px; }
  .scorers .goal { white-space: nowrap; }
  .scorers .min { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tv { font-size: 12px; color: var(--muted); }
  .tv::before { content: "📺 "; }
  .league-name { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 12px 0 4px; font-weight: 600;
                 text-transform: uppercase; letter-spacing: .03em; }
  .league-name:first-child { margin-top: 0; }
  h2.with-control { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h2.with-control .controls { margin-left: auto; display: flex; gap: 6px; }
  .comp-line { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .comp-line a { display: contents; color: inherit; }
  /* on phones the team and competition bars show only their first chips, with a toggle for the rest */
  .more-btn { display: none; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 640px) {
    .collapsible:not(.expanded) > .extra { display: none; }
    .collapsible .more-btn { display: inline-flex; }
  }
  select { font: inherit; font-size: 12.5px; text-transform: none; letter-spacing: 0; color: var(--text);
           background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  #next { max-height: min(70vh, 640px); overflow-y: auto; margin-right: -6px; padding-right: 6px; }
  .league-name .stage { font-weight: 500; text-transform: none; letter-spacing: 0; }
  .next-day { font-weight: 700; font-size: 13.5px; margin: 16px 0 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .next-day:first-child { margin-top: 0; }
  .next-day.today { color: var(--accent); }
  .next-day + .league-name { margin-top: 6px; }
  .st-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .st-head h3 { margin: 0; }
  .st-head .spacer { flex: 1; }
  .rivals-btn { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .rivals-btn .chev { display: inline-block; transition: transform .15s; }
  .rivals-btn[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  #round { margin-top: 10px; }
  .ko-title { margin: 18px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .ko-rounds .rival-chip:disabled { opacity: .45; }
  .ko-games { display: grid; gap: 2px 14px; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); align-items: start; }
  .ko-games .game-row + .game-row { margin-top: 0; }
  .game-row .teams .through { color: var(--ok); font-weight: 700; font-size: 12px; }
  .game-row .teams .tpos { font-size: 11.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ----- standings ----- */
  .tables { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 5px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.name, th.name { text-align: left; width: 100%; white-space: normal; }
  td.name a { display: inline-flex; align-items: center; gap: 6px; }
  td.pos { border-left: 3px solid transparent; text-align: left; color: var(--muted); }
  tr.follow td { background: var(--follow-bg); font-weight: 700; }
  tr.rival td { background: var(--rival-bg); }
  tr.rival td.name { font-weight: 600; }
  .rival-picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  #team-bar-section .rival-picker { margin: 0; }
  .bar-sep { width: 1px; align-self: stretch; min-height: 22px; background: var(--line); margin: 0 6px; }
  .st-head .st-team { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
  .rival-picker .label { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
  .rival-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px 3px 5px; background: var(--card); }
  .rival-chip[aria-pressed="true"] { background: var(--follow-bg); border-color: var(--accent); font-weight: 600; }
  .rival-sub { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .table-title { font-weight: 600; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* ----- manage dialog ----- */
  dialog { width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 14px;
           padding: 0; background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
  .dlg-head h2 { margin: 0; flex: 1; }
  .dlg-body { padding: 14px 16px; }
  .dlg-body h4 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .dlg-body h4:first-child { margin-top: 0; }
  .m-team { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .m-team-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .m-team-head .grow { flex: 1; }
  .m-players { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 28px; align-items: center; }
  .m-pchip { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; background: var(--chip); border-radius: 999px; padding: 1px 2px 1px 9px; }
  .m-pchip button { padding: 0 6px; }
  .m-players form { display: flex; gap: 4px; flex: 1; min-width: 200px; }
  .m-players input { padding: 3px 8px; font-size: 13px; }
  .m-sugg { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
  .m-sugg button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  .results { margin-top: 6px; max-height: 280px; overflow: auto; }
  .result { display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 5px 8px; }
  .result:hover { background: var(--chip); }
  .result .meta { margin-left: auto; text-align: right; }
  .result button { font-size: 12.5px; padding: 2px 8px; white-space: nowrap; }
  .dlg-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
  .dlg-foot .spacer { flex: 1; }
</style>
</head>
