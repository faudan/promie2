<script src="config.js"></script>
<script>
const API = "https://api.promiedos.com.ar";
const SITE = "https://www.promiedos.com.ar";
const API_VERSION = "1.11.7.5"; // promiedos rejects (empty {}) requests without the X-VER header
const CFG = window.TRACKER_CONFIG;
const STORE_TEAMS_V1 = "tracker.teams.v1"; // old format: plain list, also written by collapse/drag
const STORE_TEAMS = "tracker.teams.v2";    // {base, teams}: only written by edits in the Manage panel
const STORE_LAYOUT = "tracker.layout.v1";  // {order: [ids], expanded: [ids]}: card order, and cards opened (they start collapsed)
const STORE_FOLDED = "tracker.foldedSections.v1";
const STORE_RIVAL_OF = "tracker.rivalOf.v1";
const STORE_NEXT_DAYS = "tracker.nextDays.v1";
const STORE_DAY_SHOW = "tracker.dayShow.v1"; // "all" | "unfinished" | "live"
const STORE_SORT = "tracker.sort.v1"; // {day, next}: "comp" (grouped by competition) or "time"
const STORE_INDEX = `tracker.teamIndex.v1:${(CFG.searchLeagues || []).join(",")}`; // rebuilt when the league list changes
const INDEX_MAX_AGE = 7 * 864e5;

let followed = new Map();  // team id -> {id, name, followTeam, players: [], collapsed}; Map order = card order
let rivals = new Map();    // rivals of the selected team: team id -> {name, reasons: [{comp, text: "5º Clausura · Grupo B (−1 pts)"}]}
let rivalOf = null;        // followed team whose standings and rivals are shown (saved; defaults to the first team)
let focusTeam = null;      // team picked in the top bar: also filters Next matches (null = "All", on every page load)
let dayOffset = 0;
const gamecenterCache = new Map();
const leagueCache = new Map();
const teamDataCache = new Map();

// ---------- settings ----------
// The team list comes from config.js unless it was edited in the Manage panel on this device. An edited list
// remembers which config.js it was based on, so a later config.js change (e.g. pushed from another computer)
// is offered instead of silently ignored. Card order and collapsed state are a separate, per-device layout.
const normalizeTeam = t => ({
  id: t.id, name: t.name, followTeam: t.followTeam !== false,
  players: [...(t.players || (t.player ? [t.player] : []))],
});
const teamsSignature = list => JSON.stringify(list.map(normalizeTeam));
const CONFIG_SIGNATURE = teamsSignature(CFG.teams);
let configConflict = false; // this device's edited list predates the current config.js

function storageGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
function storageSet(key, v) { try { v == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(v)); } catch { /* private mode */ } }

function migrateV1() {
  const old = storageGet(STORE_TEAMS_V1);
  if (!Array.isArray(old)) return;
  if (!storageGet(STORE_LAYOUT))
    storageSet(STORE_LAYOUT, { order: old.map(t => t.id) }); // cards start collapsed, so old "expanded" (the old default) isn't carried over
  // keep the old list only if it really differs from config.js; base null = unknown, so it gets the banner
  if (teamsSignature(old) !== CONFIG_SIGNATURE && !storageGet(STORE_TEAMS)) storageSet(STORE_TEAMS, { base: null, teams: old.map(normalizeTeam) });
  storageSet(STORE_TEAMS_V1, null);
}

function loadTeams() {
  migrateV1();
  const saved = storageGet(STORE_TEAMS);
  const list = Array.isArray(saved?.teams) ? saved.teams : CFG.teams;
  configConflict = !!saved && saved.base !== CONFIG_SIGNATURE && teamsSignature(saved.teams) !== CONFIG_SIGNATURE;
  const layout = storageGet(STORE_LAYOUT) || {};
  const rank = id => { const i = (layout.order || []).indexOf(id); return i < 0 ? Infinity : i; };
  const teams = list.map(normalizeTeam).map((t, i) => ({ ...t, collapsed: !(layout.expanded || []).includes(t.id), i }))
    .sort((a, b) => rank(a.id) - rank(b.id) || a.i - b.i); // dragged order first, new teams keep their list position
  followed = new Map(teams.map(({ i, ...t }) => [t.id, t]));
  renderConfigBanner();
}
function saveTeams() {
  const teams = [...followed.values()].map(normalizeTeam);
  // an edit that ends up identical to config.js just means "use config.js"
  storageSet(STORE_TEAMS, teamsSignature(teams) === CONFIG_SIGNATURE ? null : { base: CONFIG_SIGNATURE, teams });
  saveLayout();
  configConflict = false;
  renderConfigBanner();
}
function saveLayout() {
  const all = [...followed.values()];
  storageSet(STORE_LAYOUT, { order: all.map(t => t.id), expanded: all.filter(t => !t.collapsed).map(t => t.id) });
}

function renderConfigBanner() {
  const el = document.getElementById("config-banner");
  if (el) el.hidden = !configConflict;
}

// ---------- fetch helpers ----------
async function api(path) {
  const res = await fetch(API + path, { headers: { "X-VER": API_VERSION } });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  const data = await res.json();
  if (!data || Object.keys(data).length === 0)
    throw new Error(`${path}: empty response (promiedos may have bumped its API version; update API_VERSION)`);
  return data;
}

function cached(cache, key, load) {
  if (!cache.has(key)) cache.set(key, load().catch(e => { cache.delete(key); throw e; }));
  return cache.get(key);
}
function gamecenter(id, fresh = false) {
  if (fresh) gamecenterCache.delete(id);
  return cached(gamecenterCache, id, () => api(`/gamecenter/${id}`).then(d => d.game));
}
const leagueTables = id => cached(leagueCache, id, () => api(`/league/tables_and_fixtures/${id}`).then(d => { indexStandings(id, d); return d; }));

// ---------- formatting ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const pad = n => String(n).padStart(2, "0");
const apiDate = d => `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

// promiedos serves logos at /images/{team|league}/{id}/{size}; size 1 is ~60px, 2 is ~100px
const hideBroken = `onerror="this.style.visibility='hidden'"`;
const teamLogo = (id, cls = "") => id ? `<img class="logo ${cls}" src="${API}/images/team/${esc(id)}/${cls === "lg" ? 2 : 1}" alt="" loading="lazy" ${hideBroken}>` : "";
const leagueLogo = (id, cls = "sm") => id ? `<img class="logo league ${cls}" src="${API}/images/league/${esc(id)}/1" alt="" loading="lazy" ${hideBroken}>` : "";

function parseStart(s) { // "01-11-2026 15:00"
  const m = /^(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2})/.exec(s || "");
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]) : null;
}
function fmtWhen(s) {
  const d = parseStart(s);
  if (!d) return { day: "", time: esc(s), diff: null };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 864e5);
  const rel = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : DAYS[d.getDay()];
  return { day: `${rel} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, diff };
}
const gameUrl = g => `${SITE}/game/${g.url_name}/${g.id}`;
const teamUrl = t => t.url_name ? `${SITE}/team/${t.url_name}/${t.id}` : SITE;

function statusInfo(g) {
  const e = g.status?.enum;
  if (e === 1) return { kind: "scheduled" };
  if (e === 3) return { kind: "finished", label: g.status.short_name || "Final" };
  if (e === 2) return { kind: "live", label: g.game_time_to_display || g.game_time_status_to_display || "Live" };
  return { kind: "other", label: g.status?.name || "" };
}
const scoreText = g => Array.isArray(g.scores) ? g.scores.map(n => Math.round(n)).join(" - ") : "";
function tvFromGamecenter(gc) {
  const row = (gc?.game_info || []).find(i => /tv/i.test(i.name));
  return row ? row.value.split(",").map(s => s.trim()).filter(Boolean) : [];
}
const tvFromGame = g => (g.tv_networks || []).map(n => n.name);

// ---------- player availability ----------
function samePlayer(a, b) { const x = norm(a), y = norm(b); return !!x && !!y && (x === y || x.includes(y) || y.includes(x)); }
const isFollowedPlayer = (name, teamId) => [...followed.values()].some(t => (!teamId || t.id === teamId) && t.players.some(p => samePlayer(p, name)));

// status of a followed player in a game, as {cls, tail}: the badge reads name + tail ("Messi" + " starts")
function playerStatus(gc, teamId, playerName) {
  const idx = (gc.teams || []).findIndex(t => t.id === teamId);
  if (idx < 0) return { cls: "", tail: ": ?" };
  const matches = p => samePlayer(p.name, playerName);

  const lu = gc.players?.lineups?.teams?.find(t => t.team_num === idx + 1);
  const missing = (gc.players?.missing_players || [])[idx] || [];
  const miss = missing.find(matches);

  if (lu && (lu.starting?.length || lu.bench?.length)) {
    const probable = lu.status && norm(lu.status) !== "confirmado" ? " (probable)" : "";
    // goals from the player's events; assists only from the timeline, where a goal lists scorer then assister
    const contributions = p => {
      const goals = p.events?.goals?.goals || 0;
      const assists = (gc.events || []).flatMap(s => s.rows || []).flatMap(r => r.events || [])
        .filter(e => e.type === 1 && e.team === idx + 1 && e.texts?.[1] && samePlayer(e.texts[1], p.name)).length;
      return "⚽".repeat(goals) + "🅰️".repeat(assists);
    };
    const starter = lu.starting?.find(matches);
    if (starter) {
      const ev = starter.events || {};
      const extra = [
        contributions(starter),
        ev.substitution?.has_substitution ? `off ${Math.round(ev.substitution.time)}'` : "",
      ].filter(Boolean).join(" ");
      return { cls: "ok", tail: ` starts${probable}${extra ? " · " + extra : ""}` };
    }
    const sub = lu.bench?.find(matches);
    if (sub) {
      const ev = sub.events || {};
      const on = sub.substitution || ev.substitution?.has_substitution;
      const t = sub.substitution?.time ?? ev.substitution?.time;
      const extra = on ? contributions(sub) : "";
      return { cls: "warn", tail: ` on the bench${probable}${on ? ` · came on${t >= 0 ? ` ${Math.round(t)}'` : ""}${extra ? " " + extra : ""}` : ""}` };
    }
    if (miss) return { cls: "bad", tail: ` out: ${miss.missing_details?.reason || "unavailable"}` };
    return { cls: "bad", tail: ` not in the squad${probable}` };
  }
  if (miss) {
    const d = miss.missing_details || {};
    const doubtful = d.will_play_status && d.will_play_status !== 2;
    return { cls: doubtful ? "warn" : "bad", tail: `: ${d.reason || "unavailable"}${d.will_play ? " · " + d.will_play : ""}` };
  }
  return { cls: "", tail: `: lineup not out yet` };
}

const badgeHtml = b => `<span class="badge ${b.cls}">${esc(b.text)}</span>`;
const lastName = name => name.trim().split(/\s+/).pop();
// one badge per status: players of a team in the same situation share it, by last name ("Álvarez, Griezmann starts")
function playerBadgesFor(g, gc, onlyTeamId) {
  return g.teams.filter(t => (!onlyTeamId || t.id === onlyTeamId) && followed.get(t.id)?.players.length).flatMap(t => {
    const groups = new Map(); // cls + tail -> {cls, tail, names}
    for (const p of followed.get(t.id).players) {
      const st = playerStatus(gc, t.id, p), key = `${st.cls}|${st.tail}`;
      if (!groups.has(key)) groups.set(key, { ...st, names: [] });
      groups.get(key).names.push(p);
    }
    return [...groups.values()].map(({ cls, tail, names }) =>
      badgeHtml({ cls, text: (names.length > 1 ? names.map(lastName).join(", ") : names[0]) + tail }));
  }).join("");
}
function statusBadge(g) {
  const st = statusInfo(g);
  if (st.kind === "live") return `<span class="badge live">LIVE ${esc(st.label)} · ${esc(scoreText(g))}</span>`;
  if (st.kind === "finished") return `<span class="badge">${esc(st.label)} · ${esc(scoreText(g))}</span>`;
  return "";
}

// ---------- team data: fixtures, player status and positions in the competitions they play ----------
let todayGamesPromise = null;
function todayGames() {
  todayGamesPromise ??= api(`/games/${apiDate(new Date())}`)
    .then(d => (d.leagues || []).flatMap(l => l.games || []))
    .catch(() => []);
  return todayGamesPromise;
}

const isRelegationTable = g => /promedio|descenso|relegation/i.test([g.name, ...(g.tables || []).map(t => t.name)].join(" "));
const hasTeam = (table, id) => (table.rows || []).some(r => r.entity?.object?.id === id);

async function teamPositions(teamId, comps) {
  return Promise.all(comps.map(async c => {
    let data;
    try { data = await leagueTables(c.id); } catch { return { ...c, rows: [] }; }
    const cfg = (CFG.leagues || []).find(l => l.id === c.id);
    let tables;
    if (cfg) {
      tables = pickTables(data, cfg.tables || ["current"]).filter(x => hasTeam(x.table, teamId));
    } else {
      // first (= current) phase that has the team, e.g. LaLiga's table or a Libertadores group
      const g = (data.tables_groups || []).find(g => !isRelegationTable(g) && g.tables?.some(t => hasTeam(t.table, teamId)));
      tables = g ? g.tables.filter(t => hasTeam(t.table, teamId)).map(t => ({ title: g.tables.length > 1 ? t.name : "", table: t.table })) : [];
    }
    return {
      ...c, name: data.league?.name || c.name,
      rows: tables.map(({ title, table }) => ({ title, table, row: table.rows.find(r => r.entity?.object?.id === teamId) })),
    };
  }));
}

async function loadTeamData(t) {
  const data = await api(`/team/${t.id}`);
  const upcoming = (data.games?.next?.rows || []).map(r => ({ g: r.game, homeAway: r.values?.find(v => v.key === "home_away")?.value }));
  // the team's "next" list drops matches once they kick off, so add today's (live or just finished) from the day feed
  const todays = (await todayGames()).filter(g => g.teams.some(x => x.id === t.id) && !upcoming.some(u => u.g.id === g.id))
    .map(g => ({ g, homeAway: g.teams[0].id === t.id ? "L" : "V" }));
  const shown = CFG.upcomingPerTeam || 3;
  // look a bit further ahead than what's shown, to learn which competitions the team is playing
  const games = await Promise.all([...todays, ...upcoming].slice(0, Math.max(shown, 6)).map(async m => {
    let gc = null;
    try { gc = await gamecenter(m.g.id); } catch { /* still show the fixture */ }
    return { ...m, gc };
  }));
  // competitions = the ones in upcoming matches (main_league can be stale, e.g. a national team's last World Cup)
  const comps = new Map();
  for (const { g, gc } of games) {
    const l = gc?.league;
    if (!l?.id) continue;
    if (!comps.has(l.id)) comps.set(l.id, { id: l.id, name: l.name });
    comps.get(l.id).round ??= g.stage_round_name;
  }
  for (const { g, gc } of games) if (gc?.league?.id) gameLeague.set(g.id, { id: gc.league.id, name: gc.league.name, stage: gc.stage_round_name });
  if (!comps.size && data.main_league?.id) comps.set(data.main_league.id, { id: data.main_league.id, name: data.main_league.name });
  const [positions, playerStats] = await Promise.all([
    teamPositions(t.id, [...comps.values()]),
    playerCompStats(t, data.stats?.filters || [], [...comps.values()]),
  ]);
  // `upcoming` = the first few, with gamecenter; `next` = the team's whole list of upcoming matches (no gamecenter)
  return { comp: data.competitor || {}, games: games.slice(0, shown), upcoming: games,
           next: [...todays, ...upcoming], last: (data.games?.last?.rows || []).map(r => r.game).filter(Boolean),
           mainLeague: data.main_league?.id, positions, playerStats };
}

// Goals/assists of the followed players, per competition. The team's stats come in "filters" named like
// "Liga Profesional Argentina - Clausura" or "Champions League"; only the selected one is inlined.
async function playerCompStats(t, filters, comps) {
  if (!t.players.length) return {};
  const out = {};
  await Promise.all(comps.map(async c => {
    const f = filters.find(f => norm(f.name).startsWith(norm(c.name)));
    if (!f) return;
    let tables = f.tables?.length ? f.tables : null;
    if (!tables) {
      try { tables = (await api(`/team/${t.id}/players_statistics/${f.key}`)).tables || []; } catch { return; }
    }
    // lists are capped at 10 players: missing from a full list means "unknown", not 0
    const stat = (player, key) => {
      const rows = tables.find(tb => tb.columns?.some(col => col.key === key))?.rows || [];
      const row = rows.find(r => samePlayer(r.entity?.object?.name, player));
      return row ? +(row.values?.find(v => v.key === key)?.value || 0) : rows.length >= 10 ? "–" : 0;
    };
    out[c.id] = t.players.map(p => ({ player: p, goals: stat(p, "Goals"), assists: stat(p, "Assists") }));
  }));
  return out;
}

const teamData = t => cached(teamDataCache, t.id, () => loadTeamData(t));

// ---------- team cards ----------
function featuredMatch(t, { g, gc, homeAway }) {
  const opp = g.teams.find(x => x.id !== t.id) || g.teams[1];
  const w = fmtWhen(g.start_time);
  const tv = tvFromGamecenter(gc);
  const league = gc?.league;
  return `<div class="featured">
    <div class="comp">${leagueLogo(league?.id)}<span>${esc(league?.name || "Next match")}${g.stage_round_name ? ` <span class="round">· ${esc(g.stage_round_name)}</span>` : ""}</span></div>
    <div class="fixture">
      <div class="datebox ${w.diff === 0 ? "today" : ""}"><span class="t">${w.time}</span><span class="d">${w.day}</span></div>
      <a class="opp" href="${gameUrl(g)}" target="_blank" rel="noopener">
        <span class="ha">${homeAway === "V" ? "@" : "vs"}</span>${teamLogo(opp.id, "md")}<span>${esc(opp.name)}</span></a>
    </div>
    ${tv.length ? `<div class="tvs">${tv.map(n => `<span class="tv-pill">${esc(n)}</span>`).join("")}</div>` : ""}
    <div class="badges">${statusBadge(gc || g)}${gc ? playerBadgesFor(g, gc, t.id) : ""}</div>
  </div>`;
}

function compactMatch(t, { g, gc, homeAway }) {
  const opp = g.teams.find(x => x.id !== t.id) || g.teams[1];
  const w = fmtWhen(g.start_time);
  const tv = tvFromGamecenter(gc);
  const league = gc?.league;
  return `<div class="later-row">
    <div class="when ${w.diff === 0 ? "today" : ""}"><b>${w.time}</b><br>${w.day}</div>
    <span title="${esc(league?.name || "")}">${leagueLogo(league?.id, "")}</span>
    <a class="who" href="${gameUrl(g)}" target="_blank" rel="noopener"><span class="ha">${homeAway === "V" ? "@" : "vs"}</span>${teamLogo(opp.id)}<span>${esc(opp.name)}</span></a>
    <div class="extra">${esc(league?.name || "")}${g.stage_round_name ? ` · ${esc(g.stage_round_name)}` : ""}${tv.length ? ` · 📺 ${esc(tv.join(", "))}` : ""}</div>
    <div class="badges">${statusBadge(gc || g)}${gc ? playerBadgesFor(g, gc, t.id) : ""}</div>
  </div>`;
}

function positionsHtml(positions, playerStats = {}) {
  const lines = positions.map(p => {
    const ga = (playerStats[p.id] || []).map(s =>
      `<span class="pos-item"><span class="pos-player">${esc(s.player.split(" ").slice(-1)[0])}</span><b>${s.goals}</b><span class="muted">G</span><b>${s.assists}</b><span class="muted">A</span></span>`).join("");
    const items = p.rows.length ? p.rows.map(({ title, table, row }) => {
      const pts = row.values?.find(v => v.key === "Points")?.value;
      const dest = (table.destinations || []).find(d => d.color === row.destination_color)?.name;
      return `<span class="pos-item" title="${esc(dest || "")}">${title ? `<span class="muted">${esc(title)}</span>` : ""}
        <b class="pos-num" style="border-left-color:${esc(row.destination_color || "transparent")}">${row.num}º</b>
        ${pts != null ? `<span class="muted">${esc(pts)} pts</span>` : ""}</span>`;
    }).join("") : p.round ? `<span class="pos-item muted">${esc(p.round)}</span>` : "";
    return items || ga ? `<div class="pos-line">${leagueLogo(p.id)}<a class="pos-league" href="#" data-comp="${esc(p.id)}">${esc(p.name)}</a>${items}${ga}</div>` : "";
  }).join("");
  return lines ? `<div class="positions">${lines}</div>` : "";
}

function cardHead(t, comp) {
  const handle = `<span class="drag" title="Drag to reorder">⋮⋮</span>`;
  const toggle = `<button class="icon collapse-btn" data-collapse title="Collapse / expand">▾</button>`;
  const link = (label, cls) => `<a class="${cls}" href="${comp?.url_name ? teamUrl(comp) : SITE}" target="_blank" rel="noopener">${label}</a>`;
  const teamName = esc(comp?.name || t.name);
  if (!t.followTeam && t.players.length) {
    // player-first header: the player is what you follow, the team is context
    return `<div class="tc-head">${handle}${teamLogo(t.id, "lg")}
      <div class="grow"><div class="name">★ ${esc(t.players.join(" · "))}</div><div class="sub">${link(teamName, "")}</div></div>${toggle}</div>`;
  }
  return `<div class="tc-head">${handle}${teamLogo(t.id, "lg")}
    <div class="grow">${link(teamName, "name")}
      ${t.players.length ? `<div class="players">${t.players.map(p => `<span class="pchip">${esc(p)}</span>`).join("")}</div>` : ""}</div>${toggle}</div>`;
}

function cardHtml(t, data) {
  const cls = `team-card${t.collapsed ? " collapsed" : ""}`;
  const attrs = `class="${cls}" data-id="${esc(t.id)}" style="--team-color:${esc(data?.comp?.colors?.color || "")}"`;
  if (!data) return `<div ${attrs}>${cardHead(t)}<div class="card-loading">Loading…</div></div>`;
  if (data.error) return `<div ${attrs}>${cardHead(t)}<div class="featured err">${esc(data.error)}</div></div>`;
  const [first, ...rest] = data.games;
  if (t.collapsed)
    return `<div ${attrs}>${cardHead(t, data.comp)}
      ${first ? `<div class="later">${compactMatch(t, first)}</div>` : `<div class="card-loading">No upcoming matches listed.</div>`}
      ${positionsHtml(data.positions, data.playerStats)}</div>`;
  return `<div ${attrs}>${cardHead(t, data.comp)}
    ${first ? featuredMatch(t, first) : `<div class="featured muted">No upcoming matches listed.</div>`}
    ${rest.length ? `<div class="later">${rest.map(m => compactMatch(t, m)).join("")}</div>` : ""}
    ${positionsHtml(data.positions, data.playerStats)}
  </div>`;
}

const cardsEls = () => [document.getElementById("teams"), document.getElementById("players")];
const sectionOf = t => t.followTeam ? "team" : "player";

const resolvedTeamData = new Map(); // team id -> loaded data, for the competitions bar

function replaceCard(t, data) {
  const el = document.querySelector(`.team-card[data-id="${CSS.escape(t.id)}"]`);
  if (el) el.outerHTML = cardHtml(t, data);
  if (!data || data.error) return;
  resolvedTeamData.set(t.id, data);
  renderCompBar();
  const before = rivalOf;
  renderRivalPicker();
  // the selected team's rivals are known as soon as its data is in: don't wait for every card to load,
  // or the chip shows as selected while the day view toggle and standings have no rivals yet
  if (rivalOf && (rivalOf !== before || t.id === rivalOf)) refreshRivalViews();
  renderNext();
}

// How much each competition matters to you: followed teams in it, then teams followed for their players.
// A team counts for the competitions it has a table in and those of its upcoming matches (cups).
function compWeights() {
  const w = new Map(); // comp id -> {teams, players}
  for (const t of followed.values()) {
    const d = resolvedTeamData.get(t.id);
    if (!d) continue;
    const ids = new Set(d.positions.map(p => p.id));
    for (const m of [...d.upcoming, ...d.next]) { const lg = gameLeague.get(m.g.id); if (lg?.id) ids.add(lg.id); }
    for (const id of ids) {
      if (!w.has(id)) w.set(id, { teams: 0, players: 0 });
      w.get(id)[t.followTeam ? "teams" : "players"]++;
    }
  }
  return w;
}
// comparator for competition ids, most important first (stable: ties keep their order)
function byCompWeight(w = compWeights()) {
  const z = { teams: 0, players: 0 };
  return (a, b) => { const x = w.get(a) || z, y = w.get(b) || z; return y.teams - x.teams || y.players - x.players; };
}

const expandedBars = new Set(); // ids of the bars opened with "+N more" (this page load only)
const BAR_VISIBLE = 4;          // chips shown in a collapsed bar
// Marks the chips past the first few as .extra (hidden on phones, see the CSS) and adds a toggle.
// A selected chip always stays visible, and so do labels/separators followed by a visible chip.
function collapseBar(el, chipSel) {
  el.classList.add("collapsible");
  el.classList.toggle("expanded", expandedBars.has(el.id));
  const kids = [...el.children];
  let n = 0, extras = 0;
  for (const k of kids) if (k.matches(chipSel) && n++ >= BAR_VISIBLE && k.getAttribute("aria-pressed") !== "true") { k.classList.add("extra"); extras++; }
  if (!extras) return;
  kids.forEach((k, i) => {
    if (k.matches(chipSel)) return;
    const nextChip = kids.slice(i + 1).find(x => x.matches(chipSel));
    if (!nextChip || nextChip.classList.contains("extra")) k.classList.add("extra");
  });
  el.insertAdjacentHTML("beforeend", `<button class="more-btn" data-more-bar="${esc(el.id)}">${expandedBars.has(el.id) ? "Show less" : `+${extras} more`}</button>`);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-more-bar]");
  if (!b) return;
  const id = b.dataset.moreBar;
  expandedBars.has(id) ? expandedBars.delete(id) : expandedBars.add(id);
  id === "comp-bar" ? renderCompBar() : renderRivalPicker();
});

function renderCompBar() {
  const comps = new Map();
  for (const t of followed.values())
    for (const p of resolvedTeamData.get(t.id)?.positions || []) if (!comps.has(p.id)) comps.set(p.id, p.name);
  for (const lg of CFG.leagues || []) if (!comps.has(lg.id)) comps.set(lg.id, lg.name);
  const cmp = byCompWeight();
  const list = [...comps].sort(([a], [b]) => cmp(a, b));
  document.getElementById("comp-section").hidden = !comps.size;
  const bar = document.getElementById("comp-bar");
  bar.innerHTML = `<span class="label">Competitions</span>` +
    list.map(([id, name]) => `<button class="comp-chip" data-comp="${esc(id)}">${leagueLogo(id, "")}${esc(name)}</button>`).join("");
  collapseBar(bar, ".comp-chip");
}

function renderTeams() {
  // keep what's on screen (e.g. on auto-refresh) until fresh data arrives, instead of flashing "Loading…"
  const shown = new Map([...document.querySelectorAll(".team-card[data-id]")].map(c => [c.dataset.id, c.outerHTML]));
  for (const el of cardsEls()) {
    const teams = [...followed.values()].filter(t => sectionOf(t) === el.dataset.section);
    el.closest("section").hidden = !teams.length && el.dataset.section === "player";
    el.closest("section").querySelector(".count").textContent = teams.length || "";
    el.innerHTML = teams.map(t => shown.get(t.id) || cardHtml(t, null)).join("")
      || `<div class="muted">No teams yet. Use “Manage” to add some.</div>`;
  }
  return Promise.all([...followed.values()].map(t =>
    teamData(t).catch(e => ({ error: e.message })).then(data => replaceCard(t, data))));
}

// fold / unfold the "My teams" and "Players" sections (and the match lists and standings), to get to what's below faster
function applyFolded() {
  const folded = storageGet(STORE_FOLDED) || [];
  for (const sec of document.querySelectorAll("#teams-section, #players-section, section.foldable")) {
    sec.classList.toggle("folded", folded.includes(sec.id));
    sec.querySelector(".sec-toggle, .fold-btn").setAttribute("aria-expanded", String(!folded.includes(sec.id)));
  }
}
document.querySelectorAll(".sec-toggle, .fold-btn").forEach(b => b.addEventListener("click", () => {
  const id = b.closest("section").id;
  const folded = storageGet(STORE_FOLDED) || [];
  storageSet(STORE_FOLDED, folded.includes(id) ? folded.filter(x => x !== id) : [...folded, id]);
  applyFolded();
}));
applyFolded();

// collapse / expand
for (const el of cardsEls()) el.addEventListener("click", async e => {
  if (!e.target.closest("[data-collapse]")) return;
  const t = followed.get(e.target.closest(".team-card").dataset.id);
  t.collapsed = !t.collapsed;
  saveLayout();
  replaceCard(t, await teamData(t).catch(err => ({ error: err.message })));
});

// drag to reorder (pointer events, so it also works on touch screens)
for (const container of cardsEls()) container.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".drag");
  if (!handle || e.button > 0) return;
  e.preventDefault();
  const card = handle.closest(".team-card");
  card.classList.add("dragging");
  const singleColumn = () => card.getBoundingClientRect().width > container.getBoundingClientRect().width * .7;
  const move = ev => {
    const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".team-card");
    if (!over || over === card || over.parentElement !== container) return;
    const r = over.getBoundingClientRect();
    const after = singleColumn() ? ev.clientY > r.top + r.height / 2 : ev.clientX > r.left + r.width / 2;
    if (after ? over.nextElementSibling !== card : over.previousElementSibling !== card)
      container.insertBefore(card, after ? over.nextElementSibling : over);
  };
  // listen on the document: moving the card in the DOM would drop pointer capture on the handle
  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", up);
    card.classList.remove("dragging");
    const order = cardsEls().flatMap(el => [...el.querySelectorAll(".team-card")].map(c => c.dataset.id));
    followed = new Map([...order, ...followed.keys()].filter((id, i, a) => followed.has(id) && a.indexOf(id) === i).map(id => [id, followed.get(id)]));
    saveLayout();
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", up);
});

// ---------- Standings + rivals ----------

function pickTables(data, wanted) {
  const groups = data.tables_groups || [];
  const out = [];
  for (const w of wanted) {
    if (w === "current") {
      const g = groups.find(g => g.tables?.length);
      if (g) g.tables.forEach(t => out.push({ title: [g.name, t.name].filter(Boolean).join(" · "), table: t.table }));
      continue;
    }
    for (const g of groups) for (const t of g.tables || []) {
      const title = [g.name, t.name].filter(Boolean).join(" · ");
      if (norm(title).includes(norm(w)) && !out.some(o => o.table === t.table))
        out.push({ title: t.name.replace(/^(.+) - \1$/, "$1") || title, table: t.table });
    }
  }
  return out;
}

// The tables a competition shows: for config.js leagues, its `tables`; otherwise the current phase
function compTableList(id, data) {
  const cfg = (CFG.leagues || []).find(l => l.id === id);
  if (cfg) return pickTables(data, cfg.tables || ["current"]);
  const g = (data.tables_groups || []).find(g => g.tables?.length && !isRelegationTable(g));
  return g ? g.tables.map(t => ({ title: g.tables.length > 1 ? t.name : "", table: t.table })) : [];
}

// competition id -> Map(team id -> {num, pts, title}): a team's place in the first of those tables it's in
// (e.g. River: its Clausura group, not the Tabla Anual). Shown next to team names in match rows.
const standingIndex = new Map();
function indexStandings(id, data) {
  const idx = new Map();
  for (const { title, table } of compTableList(id, data)) for (const r of table.rows || []) {
    const o = r.entity?.object;
    if (o?.id && !idx.has(o.id)) idx.set(o.id, { num: r.num, pts: pointsOf(r), title });
  }
  standingIndex.set(id, idx);
}

// Rivals = teams within CFG.rivals.points points (above or below) of the selected team, in every table it is in
// (the same tables its card footer shows, e.g. River: its Clausura group and the Tabla Anual).
const pointsOf = row => +(row.values?.find(v => v.key === "Points")?.value || 0);
const rivalCandidates = () => [...followed.values()].filter(t => resolvedTeamData.get(t.id)?.positions?.some(p => p.rows.length));

function computeRivals() {
  rivals = new Map();
  const range = CFG.rivals?.points ?? 3;
  for (const p of resolvedTeamData.get(rivalOf)?.positions || []) for (const { title, table, row } of p.rows) {
    for (const r of table.rows || []) {
      const o = r.entity?.object;
      const diff = pointsOf(r) - pointsOf(row);
      if (!o || o.id === rivalOf || Math.abs(diff) > range) continue;
      const entry = rivals.get(o.id) || { name: o.name, reasons: [] };
      entry.reasons.push({ comp: p.id, text: `${r.num}º ${title || p.name} (${diff > 0 ? "+" : diff < 0 ? "−" : "±"}${Math.abs(diff)} pts)` });
      rivals.set(o.id, entry);
    }
  }
}

function renderRivalPicker() {
  const candidates = rivalCandidates(); // teams with a table: the default standings team is one of these
  const saved = storageGet(STORE_RIVAL_OF);
  // default to the first followed team (in card order) that has a table, waiting for teams still loading
  // so the default doesn't depend on which loads first; a team picked in the bar is kept even without a table
  const fallback = [...followed.values()].find(t => t.followTeam && (!resolvedTeamData.has(t.id) || candidates.includes(t)));
  rivalOf = (followed.has(saved) ? saved : null) ?? fallback?.id ?? candidates[0]?.id ?? null;
  if (focusTeam && !followed.has(focusTeam)) focusTeam = null;
  // every followed team: teams first, then a separator and the teams followed for their players
  const chip = (t, label) => `<button class="rival-chip" data-rival-of="${esc(t.id)}" aria-pressed="${t.id === focusTeam}">${teamLogo(t.id, "sm")}${label}</button>`;
  const all = [...followed.values()];
  const teams = all.filter(t => t.followTeam), players = all.filter(t => !t.followTeam);
  const shortName = t => esc(resolvedTeamData.get(t.id)?.comp?.short_name || t.name);
  document.getElementById("rival-picker").innerHTML = !all.length ? "" :
    `<span class="label">Team</span><button class="rival-chip" data-rival-of="" aria-pressed="${!focusTeam}">All</button>` +
    teams.map(t => chip(t, shortName(t))).join("") +
    (players.length ? `<span class="bar-sep" aria-hidden="true"></span><span class="label">Players</span>` +
      players.map(t => chip(t, shortName(t))).join("") : "");
  collapseBar(document.getElementById("rival-picker"), ".rival-chip");
  const hasTable = candidates.some(t => t.id === rivalOf);
  document.getElementById("show-rivals-label").hidden = !hasTable;
  document.getElementById("rivals-btn").hidden = !hasTable;
}

function refreshRivalViews() {
  renderRivalPicker();
  computeRivals();
  renderStandings();
  renderRound();
  return renderDay();
}

// top team bar: a team shows its standings/rivals and filters Next matches to it; "All" (or clicking the
// picked team again) clears the filter, and the standings stay on the last team picked
document.getElementById("rival-picker").addEventListener("click", e => {
  const b = e.target.closest("[data-rival-of]");
  if (!b) return;
  const id = b.dataset.rivalOf;
  focusTeam = !id || id === focusTeam ? null : id;
  renderNext();
  if (focusTeam && focusTeam !== rivalOf) { storageSet(STORE_RIVAL_OF, focusTeam); refreshRivalViews(); }
  else renderRivalPicker();
});
// competing teams' fixtures (the current round around the selected team): hidden on every page load
const rivalsBtn = document.getElementById("rivals-btn");
rivalsBtn.addEventListener("click", () => {
  const open = rivalsBtn.getAttribute("aria-expanded") !== "true";
  rivalsBtn.setAttribute("aria-expanded", String(open));
  rivalsBtn.lastElementChild.textContent = `${open ? "Hide" : "Show"} competing teams fixtures`;
  document.getElementById("round").hidden = !open;
});

function tableHtml(title, table, compId) {
  const dests = new Map((table.destinations || []).map(d => [d.color, d.name]));
  const rows = (table.rows || []).map(row => {
    const o = row.entity?.object || {};
    const v = Object.fromEntries((row.values || []).map(x => [x.key, x.value]));
    const cls = followed.has(o.id) ? "follow" : isRival(o.id, compId) ? "rival" : "";
    const border = row.destination_color ? `style="border-left-color:${esc(row.destination_color)}"` : "";
    return `<tr class="${cls}" title="${esc(dests.get(row.destination_color) || "")}">
      <td class="pos" ${border}>${row.num}</td>
      <td class="name"><a href="${teamUrl(o)}" target="_blank" rel="noopener">${teamLogo(o.id, "sm")}${esc(o.short_name || o.name)}</a></td>
      <td><b>${esc(v.Points)}</b></td><td>${esc(v.GamePlayed)}</td><td>${esc(v.Ratio)}</td>
      <td>${esc(v.GamesWon)}-${esc(v.GamesEven)}-${esc(v.GamesLost)}</td></tr>`;
  }).join("");
  const legend = (table.destinations || []).map(d => `<span><i style="background:${esc(d.color)}"></i>${esc(d.name)}</span>`).join("");
  return `<div>${title ? `<div class="table-title">${esc(title)}${table.is_live ? ' <span class="badge live">LIVE</span>' : ""}</div>` : ""}
    <table><thead><tr><th class="pos">#</th><th class="name">Team</th><th>Pts</th><th>PJ</th><th>+/-</th><th>G-E-P</th></tr></thead>
    <tbody>${rows}</tbody></table>${legend ? `<div class="legend">${legend}</div>` : ""}</div>`;
}

// The selected team's competitions: its footer ones, plus those of its upcoming and recent matches
// (cups show up there). The domestic league (promiedos' main league for the team) comes first.
const stComp = new Map(); // team id -> competition picked in the dropdown (this page load only)
function teamComps(t) {
  const d = resolvedTeamData.get(t.id);
  if (!d) return { comps: [], pending: [] };
  const isFriendly = name => /amistos/i.test(name || ""); // friendlies have no table
  const comps = new Map(d.positions.filter(p => !isFriendly(p.name)).map(p => [p.id, p.name]));
  const pending = [];
  for (const g of [...d.next.map(m => m.g).slice(0, 12), ...d.last.slice(-10)]) { // "last" runs oldest → newest
    const lg = gameLeague.get(g.id);
    if (!lg) pending.push(g.id);
    else if (lg.id && !comps.has(lg.id) && !isFriendly(lg.name)) comps.set(lg.id, lg.name);
  }
  const list = [...comps].map(([id, name]) => ({ id, name }));
  list.sort((a, b) => (b.id === d.mainLeague) - (a.id === d.mainLeague));
  return { comps: list, pending };
}

// Knockout rounds: promiedos has no bracket, only a list of rounds (each with its matches). The current
// knockout stage = the rounds after the last league-phase round (for a cup, all of them). This skips e.g.
// Liga Profesional's Apertura playoffs, listed before the Clausura matchdays.
const LEAGUE_PHASE = /fecha|jornada|matchday|temporada regular|fase de (grupos|liga)|grupo|league phase/i;
function knockoutRounds(data) {
  const f = (data.games?.filters || []).filter(x => x.key !== "latest");
  const lastLeague = f.reduce((acc, x, i) => LEAGUE_PHASE.test(x.name) ? i : acc, -1);
  return f.slice(lastLeague + 1);
}
const roundGames = (id, r) => r.games ? Promise.resolve(r.games)
  : cached(roundCache, `${id}/${r.key}`, () => api(`/league/games/${id}/${r.key}`)).then(d => d.games || []);
const koPick = new Map(); // `${team}|${comp}` -> round index picked (this page load only)

async function knockoutHtml(id, team, rounds) {
  const lists = await Promise.all(rounds.map(r => roundGames(id, r).catch(() => [])));
  const has = (games, tid) => games.some(g => g.teams.some(t => t.id === tid));
  // default: the latest round the team plays in, else the latest round with matches
  const lastIdx = pred => lists.reduce((acc, games, i) => pred(games) ? i : acc, -1);
  let pick = koPick.get(`${team.id}|${id}`);
  if (!(pick >= 0 && pick < rounds.length)) pick = Math.max(lastIdx(gs => has(gs, team.id)), lastIdx(gs => gs.length), 0);
  const chips = rounds.map((r, i) => `<button class="rival-chip" data-ko="${i}" aria-pressed="${i === pick}" ${lists[i].length ? "" : "disabled"}>
    ${esc(r.name)}${has(lists[i], team.id) ? ` ${teamLogo(team.id, "sm")}` : ""}</button>`).join("");
  const games = [...lists[pick]].sort((a, b) =>
    has([b], team.id) - has([a], team.id) || (parseStart(a.start_time) || 0) - (parseStart(b.start_time) || 0));
  return `<div class="rival-picker ko-rounds">${chips}</div>
    <div class="ko-games">${games.map(g => gameRow(g, { showDay: true, compId: id, ko: true })).join("") || `<div class="muted">No matches listed for this round yet.</div>`}</div>`;
}

let standingsToken = 0;
async function renderStandings() {
  const el = document.getElementById("standings");
  const team = followed.get(rivalOf);
  if (!team) { el.innerHTML = `<span class="muted">${followed.size ? "Loading…" : "No teams yet."}</span>`; return; }
  const { comps, pending } = teamComps(team);
  if (pending.length) loadGameLeagues(pending, renderStandings);
  const d = resolvedTeamData.get(team.id);
  const withTable = d.positions.find(p => p.rows.length)?.id;
  const selected = comps.find(c => c.id === stComp.get(team.id)) || comps.find(c => c.id === d.mainLeague) || comps.find(c => c.id === withTable) || comps[0];
  if (!selected) {
    el.innerHTML = `<div class="st-head"><span class="st-team">${teamLogo(team.id, "md")}${esc(d.comp?.name || team.name)}</span></div>
      <span class="muted">No table for ${esc(d.comp?.name || team.name)} right now${pending.length ? " (still checking its matches…)" : ""}.</span>`;
    return;
  }
  const token = ++standingsToken;
  const head = `<div class="st-head"><span class="st-team">${teamLogo(team.id, "md")}${esc(d.comp?.name || team.name)}</span>${leagueLogo(selected.id, "md")}
    <select id="st-comp" title="Competition">${comps.map(c => `<option value="${esc(c.id)}"${c.id === selected.id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
    <span class="spacer"></span><a href="#" data-comp="${esc(selected.id)}" class="meta">Matchday, scorers…</a></div>`;
  if (!el.querySelector(".st-body")) el.innerHTML = head + `<div class="muted">Loading…</div>`;
  let data;
  try { data = await leagueTables(selected.id); } catch (e) { if (token === standingsToken) el.innerHTML = head + `<div class="err">${esc(e.message)}</div>`; return; }
  if (token !== standingsToken) return; // selection changed while loading
  const tables = compTableList(selected.id, data).map(({ title, table }) => tableHtml(title, table, selected.id)).join("");
  const rounds = knockoutRounds(data);
  let ko = "";
  if (rounds.length) {
    try { ko = await knockoutHtml(selected.id, team, rounds); } catch (e) { ko = `<div class="err">${esc(e.message)}</div>`; }
    if (token !== standingsToken) return;
  }
  el.innerHTML = head + `<div class="st-body">
    ${tables ? `<div class="tables">${tables}</div>` : ""}
    ${ko ? `${tables ? `<h4 class="ko-title">Knockout stage</h4>` : ""}${ko}` : ""}
    ${!tables && !ko ? `<span class="muted">No table or knockout rounds listed for ${esc(data.league?.name || selected.name)}.</span>` : ""}</div>`;
}
document.getElementById("standings").addEventListener("click", e => {
  const b = e.target.closest("[data-ko]");
  if (!b) return;
  koPick.set(`${rivalOf}|${document.getElementById("st-comp").value}`, +b.dataset.ko);
  renderStandings();
});
document.getElementById("standings").addEventListener("change", e => {
  if (e.target.id !== "st-comp") return;
  stComp.set(rivalOf, e.target.value);
  renderStandings();
});

const isRival = (teamId, compId) => !!rivals.get(teamId)?.reasons.some(r => !compId || r.comp === compId);
function rivalNote(g, compId) {
  return g.teams.filter(t => isRival(t.id, compId))
    .map(t => `${t.short_name || t.name}: ${rivals.get(t.id).reasons.filter(r => !compId || r.comp === compId).map(r => r.text).join(", ")}`).join(" · ");
}

// one line per team that scored: "⚽ River  Beltrán 12', 76' (pen)  Correa 90'+1"; followed players get a ★
const GOAL_TYPES = { "Pen": "pen", "E.C": "og" };
function scorersHtml(g) {
  const lines = g.teams.map(t => {
    if (!t.goals?.length) return "";
    const byPlayer = new Map();
    for (const goal of t.goals) {
      const key = goal.player_name || goal.player_sname;
      if (!byPlayer.has(key)) byPlayer.set(key, { name: goal.player_sname || key, full: key, times: [] });
      const type = GOAL_TYPES[goal.goal_type] ?? goal.goal_type;
      byPlayer.get(key).times.push(`${goal.time_to_display || Math.round(goal.time) + "'"}${type ? ` (${type})` : ""}`);
    }
    const scorers = [...byPlayer.values()].map(p => {
      const name = isFollowedPlayer(p.full) ? `<b class="pos-player">${esc(p.name)}</b>` : esc(p.name);
      return `<span class="goal">${name} <span class="min">${esc(p.times.join(", "))}</span></span>`;
    }).join(" ");
    return `<span class="side">${esc(t.short_name || t.name)}</span><span class="list">${scorers}</span>`;
  }).join("");
  if (!lines) return "";
  const n = g.teams.reduce((acc, t) => acc + (t.goals?.length || 0), 0);
  return `<details class="scorers-box" data-scorers="${esc(g.id)}"${openScorers.has(g.id) ? " open" : ""}>
    <summary>⚽ ${n} goal${n > 1 ? "s" : ""}</summary><div class="scorers">${lines}</div></details>`;
}
const openScorers = new Set(); // games whose goal summary was expanded (kept across refreshes, this page load only)
document.addEventListener("toggle", e => { // toggle doesn't bubble: listen in the capture phase
  const id = e.target.dataset?.scorers;
  if (id) e.target.open ? openScorers.add(id) : openScorers.delete(id);
}, true);

function gameRow(g, opts = {}) {
  const isFollow = g.teams.some(t => followed.has(t.id));
  const rivalGame = g.teams.some(t => isRival(t.id, opts.compId));
  const derby = g.teams.length === 2 && g.teams.every(t => followed.has(t.id));
  const top3 = !!opts.compId && g.teams.length === 2 && g.teams.every(t => (standingIndex.get(opts.compId)?.get(t.id)?.num ?? 99) <= 3);
  const [standout, standoutTitle] = derby ? [" derby", "Both teams are followed"] : top3 ? [" top3", "Both teams are in the top 3"] : ["", ""];
  const w = fmtWhen(g.start_time);
  const st = statusInfo(g);
  const right = st.kind === "scheduled" ? "" :
    (st.kind === "live" ? `<span class="badge live">${esc(st.label)}</span>` : `<span class="st">${esc(st.label)}</span>`) +
    `<span class="result${st.kind === "live" ? " live" : ""}">${esc(scoreText(g))}</span>`;
  const tv = tvFromGame(g);
  const note = rivalGame ? rivalNote(g, opts.compId) : "";
  const team = t => {
    const label = esc(t.short_name || t.name);
    const pos = opts.compId && standingIndex.get(opts.compId)?.get(t.id);
    const posTxt = pos ? `<span class="tpos" title="${esc(pos.title)}">${pos.num}º · ${pos.pts} pts</span>` : "";
    const through = opts.ko && g.to_qualify > 0 && g.teams[g.to_qualify - 1] === t ? `<span class="through" title="Goes through">✓</span>` : "";
    return `<span class="t">${teamLogo(t.id, "sm")}${followed.has(t.id) ? `<strong>${label}</strong>` : label}${posTxt}${through}</span>`;
  };
  return `<div class="game-row ${isFollow ? "follow" : rivalGame ? "rival" : ""}${opts.showDay ? " with-day" : ""}${standout}"${standoutTitle ? ` title="${standoutTitle}"` : ""} ${isFollow ? `data-game="${esc(g.id)}"` : ""}>
    <div class="when"><b>${w.time}</b>${opts.showDay ? w.day : ""}</div>
    <div><a class="teams" href="${gameUrl(g)}" target="_blank" rel="noopener">${team(g.teams[0])}<span class="vs">vs</span>${team(g.teams[1])}</a>
      ${opts.compLine ? compLine(opts.compLine, g) : ""}
      ${tv.length ? `<div class="tv">${esc(tv.join(", "))}</div>` : ""}
      ${note ? `<div class="meta">${esc(note)}</div>` : ""}
      ${opts.scorers ? scorersHtml(g) : ""}
      <div class="badges">${opts.badges || ""}</div></div>
    <div class="score">${right}</div>
  </div>`;
}

// stage of a game: matchday ("Fecha 10") from the game itself, or for cups ("Cuarta Ronda") from its gamecenter
const stageOf = g => g.stage_round_name || gameLeague.get(g.id)?.stage || "";
const stagesText = games => [...new Set(games.map(stageOf).filter(Boolean))].join(" / ");
const leagueHeader = (lg, games, link = true) => {
  const stage = stagesText(games);
  const name = `${leagueLogo(lg.id)}${esc(lg.name)}`;
  return `<div class="league-name">${link && lg.id && lg.id !== "?" ? `<a href="#" data-comp="${esc(lg.id)}" style="display:contents">${name}</a>` : name}${stage ? `<span class="stage">· ${esc(stage)}</span>` : ""}</div>`;
};

// competition of a game, shown on its row when the list is sorted by time instead of grouped by competition
function compLine(lg, g) {
  const stage = stageOf(g);
  const name = `${leagueLogo(lg.id)}${esc(lg.name)}`;
  return `<div class="meta comp-line">${lg.id && lg.id !== "?" ? `<a href="#" data-comp="${esc(lg.id)}">${name}</a>` : name}${stage ? ` · ${esc(stage)}` : ""}</div>`;
}

// sort mode of a match list ("day" or "next"): "comp" = grouped by competition, "time" = one list by kick-off
const SORTS = [["comp", "By competition"], ["time", "By time"]];
const sortOf = list => (storageGet(STORE_SORT) || {})[list] === "time" ? "time" : "comp";
for (const [list, sel, render] of [["day", "day-sort", () => renderDay()], ["next", "next-sort", () => renderNext()]]) {
  const el = document.getElementById(sel);
  el.innerHTML = SORTS.map(([v, label]) => `<option value="${v}">${label}</option>`).join("");
  el.value = sortOf(list);
  el.addEventListener("change", () => { storageSet(STORE_SORT, { ...(storageGet(STORE_SORT) || {}), [list]: el.value }); render(); });
}

// which matches the day view shows: all, all but the finished ones, or only the ones being played now
const DAY_SHOWS = [["all", "All matches"], ["unfinished", "Hide finished"], ["live", "Live now"]];
const dayShow = () => DAY_SHOWS.some(([v]) => v === storageGet(STORE_DAY_SHOW)) ? storageGet(STORE_DAY_SHOW) : "all";
const dayShowSel = document.getElementById("day-show");
dayShowSel.innerHTML = DAY_SHOWS.map(([v, label]) => `<option value="${v}">${label}</option>`).join("");
dayShowSel.value = dayShow();
dayShowSel.addEventListener("change", () => { storageSet(STORE_DAY_SHOW, dayShowSel.value); renderDay(); });
const shownByDayFilter = g => {
  const kind = statusInfo(g).kind, show = dayShow();
  return show === "live" ? kind === "live" : show === "unfinished" ? kind !== "finished" : true;
};

// ---------- Next matches: upcoming matches of all followed teams, by day and competition ----------
// Covers the chosen range (2 weeks / 1 month). A team's "next" list has no competition, so games past the
// ones loaded for its card get it from their gamecenter, fetched once and kept across auto-refreshes.
const NEXT_RANGES = [[14, "2 weeks"], [30, "1 month"]];
const gameLeague = new Map(); // game id -> {id, name, stage}; not cleared on refresh, a fixture's competition doesn't change
const gameLeagueLoading = new Set();
const nextDays = () => { const v = +storageGet(STORE_NEXT_DAYS); return NEXT_RANGES.some(([d]) => d === v) ? v : CFG.nextMatchesDays ?? 14; };

async function loadGameLeagues(ids, then) {
  const queue = ids.filter(id => !gameLeagueLoading.has(id));
  if (!queue.length) return;
  queue.forEach(id => gameLeagueLoading.add(id));
  const worker = async () => {
    for (let id; (id = queue.shift());) {
      try { const gc = await gamecenter(id), l = gc.league; gameLeague.set(id, l?.id ? { id: l.id, name: l.name, stage: gc.stage_round_name } : { id: "", name: "Other" }); }
      catch { gameLeague.set(id, { id: "", name: "Other" }); }
      gameLeagueLoading.delete(id);
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  then();
}

function renderNext() {
  const el = document.getElementById("next");
  const teams = [...followed.values()].filter(t => !focusTeam || t.id === focusTeam);
  const loaded = teams.map(t => resolvedTeamData.get(t.id)).filter(Boolean);
  if (!loaded.length) { el.innerHTML = `<span class="muted">${teams.length ? "Loading…" : "No teams yet."}</span>`; return; }
  const limit = new Date(); limit.setHours(0, 0, 0, 0); limit.setDate(limit.getDate() + nextDays() + 1);
  const byId = new Map();
  for (const d of loaded) for (const m of [...d.upcoming, ...d.next]) { // the ones with gamecenter come first and win
    const start = parseStart(m.g.start_time);
    if (byId.has(m.g.id) || statusInfo(m.gc || m.g).kind === "finished" || (start && start >= limit)) continue;
    if (m.gc?.league?.id) gameLeague.set(m.g.id, { id: m.gc.league.id, name: m.gc.league.name, stage: m.gc.stage_round_name });
    byId.set(m.g.id, { ...m, start });
  }
  const list = [...byId.values()].sort((a, b) => (a.start || 0) - (b.start || 0));
  const missing = list.filter(m => !gameLeague.has(m.g.id)).map(m => m.g.id);
  const days = new Map(); // day label -> Map(league id -> {league, games})
  for (const m of list) {
    const w = fmtWhen(m.g.start_time);
    const dayKey = w.day || "Date to be confirmed";
    if (!days.has(dayKey)) days.set(dayKey, { today: w.diff === 0, leagues: new Map() });
    const lg = gameLeague.get(m.g.id) || { id: "?", name: "Loading competition…" };
    const leagues = days.get(dayKey).leagues;
    if (!leagues.has(lg.id)) leagues.set(lg.id, { lg, games: [] });
    leagues.get(lg.id).games.push(m);
  }
  const pending = teams.length - loaded.length;
  const scroll = el.scrollTop;
  const byTime = sortOf("next") === "time";
  const cmp = byCompWeight();
  const row = (lg, { g, gc }) => gameRow(gc?.status ? { ...g, status: gc.status, scores: gc.scores ?? g.scores } : g,
    { badges: gc ? playerBadgesFor(g, gc) : "", compId: lg.id, compLine: byTime ? lg : null });
  el.innerHTML = [...days].map(([day, { today, leagues }]) => {
    const groups = [...leagues.values()];
    const body = byTime
      ? groups.flatMap(({ lg, games }) => games.map(m => ({ lg, m }))).sort((a, b) => (a.m.start || 0) - (b.m.start || 0))
          .map(({ lg, m }) => row(lg, m)).join("")
      : groups.sort((a, b) => cmp(a.lg.id, b.lg.id))
          .map(({ lg, games }) => leagueHeader(lg, games.map(m => m.g)) + games.map(m => row(lg, m)).join("")).join("");
    return `<div class="next-day${today ? " today" : ""}">${esc(day)}</div>` + body;
  }).join("")
    || `<div class="muted">No upcoming matches in the next ${esc(NEXT_RANGES.find(([d]) => d === nextDays())?.[1] || nextDays() + " days")}.</div>`;
  if (pending) el.insertAdjacentHTML("beforeend", `<div class="meta" style="margin-top:8px">Loading ${pending} more team${pending > 1 ? "s" : ""}…</div>`);
  el.scrollTop = scroll;
  if (missing.length) loadGameLeagues(missing, renderNext);
  const noTable = [...new Set(list.map(m => gameLeague.get(m.g.id)?.id))].filter(id => id && !standingIndex.has(id) && !standingsLoading.has(id));
  noTable.forEach(id => standingsLoading.add(id));
  if (noTable.length) Promise.all(noTable.map(id => leagueTables(id).catch(() => standingIndex.set(id, new Map()))))
    .finally(() => { noTable.forEach(id => standingsLoading.delete(id)); renderNext(); });
}
const standingsLoading = new Set();

const nextRangeSel = document.getElementById("next-range");
nextRangeSel.innerHTML = NEXT_RANGES.map(([d, label]) => `<option value="${d}">${label}</option>`).join("");
nextRangeSel.value = String(nextDays());
nextRangeSel.addEventListener("change", () => { storageSet(STORE_NEXT_DAYS, +nextRangeSel.value); renderNext(); });

// ---------- Day view ----------
async function renderDay() {
  const el = document.getElementById("day");
  const d = new Date(); d.setDate(d.getDate() + dayOffset);
  document.getElementById("day-label").textContent =
    `${dayOffset === 0 ? "Today" : DAYS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
  const withRivals = !!rivalOf && document.getElementById("show-rivals").checked;
  try {
    const data = await api(`/games/${apiDate(d)}`);
    const shownLeagues = (data.leagues || []).filter(lg => (lg.games || []).some(g => g.teams.some(t => followed.has(t.id) || (withRivals && isRival(t.id, lg.id)))));
    // cup games have no stage in the day feed: get it from their gamecenter (once, kept across refreshes)
    const noStage = shownLeagues.flatMap(lg => lg.games).filter(g => g.teams.some(t => followed.has(t.id) || (withRivals && isRival(t.id)))).filter(g => !g.stage_round_name && !gameLeague.has(g.id)).map(g => g.id);
    await Promise.all([...shownLeagues.map(lg => leagueTables(lg.id).catch(() => standingIndex.set(lg.id, new Map()))),
      loadGameLeagues(noStage, () => {})]);
    const sections = [];
    const playerGames = [];
    const timed = []; // {g, lg}, for the "by time" order
    let hiddenByFilter = 0;
    const cmp = byCompWeight();
    for (const lg of [...data.leagues || []].sort((a, b) => cmp(a.id, b.id))) {
      const games = (lg.games || []).filter(g => g.teams.some(t => followed.has(t.id) || (withRivals && isRival(t.id, lg.id))));
      const allGames = games.length;
      games.splice(0, games.length, ...games.filter(shownByDayFilter));
      hiddenByFilter += allGames - games.length;
      if (!games.length) continue;
      games.sort((a, b) => (parseStart(a.start_time) || 0) - (parseStart(b.start_time) || 0));
      games.forEach(g => { if (g.teams.some(t => followed.get(t.id)?.players.length)) playerGames.push(g); });
      games.forEach(g => timed.push({ g, lg }));
      sections.push(leagueHeader(lg, games) + games.map(g => gameRow(g, { compId: lg.id, scorers: true })).join(""));
    }
    if (sortOf("day") === "time")
      sections.splice(0, sections.length, timed.sort((a, b) => (parseStart(a.g.start_time) || 0) - (parseStart(b.g.start_time) || 0))
        .map(({ g, lg }) => gameRow(g, { compId: lg.id, scorers: true, compLine: lg })).join(""));
    const when = dayOffset === 0 ? "today" : "this day";
    el.innerHTML = sections.join("") || `<div class="muted">${!hiddenByFilter ? `Nothing of yours ${when}.`
      : dayShow() === "live" ? `None of your ${hiddenByFilter} match${hiddenByFilter > 1 ? "es" : ""} ${when} ${hiddenByFilter > 1 ? "are" : "is"} being played right now.`
      : `All your matches ${when} are finished.`}</div>`;
    if (sections.length && hiddenByFilter)
      el.insertAdjacentHTML("beforeend", `<div class="meta" style="margin-top:8px">${hiddenByFilter} ${dayShow() === "live" ? "other" : "finished"} match${hiddenByFilter > 1 ? "es" : ""} hidden.</div>`);
    // fill in player availability for matches that have a watched player
    await Promise.all(playerGames.map(async g => {
      try {
        const gc = await gamecenter(g.id, statusInfo(g).kind !== "finished");
        const slot = el.querySelector(`[data-game="${CSS.escape(g.id)}"] .badges`);
        if (slot) slot.innerHTML = playerBadgesFor(g, gc);
      } catch { /* badge just stays empty */ }
    }));
  } catch (e) {
    el.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ---------- Current round of tracked leagues ----------
// ---------- Rivals: the current round of each competition the selected team has a table in ----------
async function renderRound() {
  const el = document.getElementById("round");
  const team = followed.get(rivalOf);
  if (!team) {
    el.innerHTML = `<span class="muted">Loading…</span>`;
    return;
  }
  const range = CFG.rivals?.points ?? 3;
  const comps = (resolvedTeamData.get(team.id)?.positions || []).filter(p => p.rows.length);
  const blocks = await Promise.all(comps.map(async p => {
    let data;
    try { data = await leagueTables(p.id); } catch (e) { return `<div class="err">${esc(e.message)}</div>`; }
    const filters = data.games?.filters || [];
    const current = filters.find(f => f.selected && f.games) || filters.find(f => f.games);
    if (!current) return "";
    const games = current.games.filter(g => g.teams.some(t => t.id === team.id || isRival(t.id, p.id)))
      .sort((a, b) => (parseStart(a.start_time) || 0) - (parseStart(b.start_time) || 0));
    return `<div class="league-name"><a href="#" data-comp="${esc(p.id)}" style="display:contents">${leagueLogo(p.id)}${esc(p.name)}</a> · ${esc(current.name)}</div>` +
      (games.map(g => gameRow(g, { showDay: true, compId: p.id })).join("") || `<div class="muted">No rival matches this round.</div>`);
  }));
  if (followed.get(rivalOf) !== team) return; // selection changed while loading
  el.innerHTML = `<div class="rival-sub">Teams within ${range} points (above or below) of ${esc(team.name)} in each table it's in.</div>` +
    (blocks.join("") || `<span class="muted">No tables for ${esc(team.name)}.</span>`);
}

// ---------- Competition view: matchday | standings | top scorers & assists ----------
const compDlg = document.getElementById("comp-dlg");
const roundCache = new Map();
let compView = null; // {id, data, rounds, idx}

function leaderTable(title, table, key) {
  if (!table?.rows?.length) return "";
  const rows = table.rows.slice(0, 10).map(r => {
    const o = r.entity?.object || {};
    const hl = isFollowedPlayer(o.name, o.team_id) || followed.has(o.team_id);
    return `<tr class="${hl ? "follow" : ""}"><td class="pos">${r.num}</td>
      <td class="name"><span>${teamLogo(o.team_id, "sm")}${esc(o.name)}</span></td>
      <td><b>${esc(r.values?.find(v => v.key === key)?.value)}</b></td></tr>`;
  }).join("");
  return `<div class="leaders"><h4>${esc(title)}</h4><table><tbody>${rows}</tbody></table></div>`;
}

const compTables = (id, data) => compTableList(id, data).map(x => tableHtml(x.title, x.table, id)).join("");

async function renderCompRound() {
  const el = document.getElementById("comp-round");
  const { id, rounds, idx } = compView;
  const r = rounds[idx];
  if (!r) { el.innerHTML = `<div class="muted">No fixtures listed.</div>`; return; }
  document.getElementById("comp-round-name").textContent = r.name;
  el.innerHTML = `<div class="muted">Loading…</div>`;
  try {
    const games = r.games || (await cached(roundCache, `${id}/${r.key}`, () => api(`/league/games/${id}/${r.key}`))).games || [];
    if (compView.rounds[compView.idx] !== r) return; // user moved on
    const sorted = [...games].sort((a, b) => (parseStart(a.start_time) || 0) - (parseStart(b.start_time) || 0));
    el.innerHTML = sorted.map(g => gameRow(g, { showDay: true, compId: id })).join("") || `<div class="muted">No matches.</div>`;
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function openCompetition(id) {
  const body = document.getElementById("comp-body");
  document.getElementById("comp-title").innerHTML = `${leagueLogo(id, "md")}<span>Loading…</span>`;
  body.innerHTML = "";
  if (!compDlg.open) compDlg.showModal();
  let data;
  try { data = await leagueTables(id); } catch (e) { body.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  document.getElementById("comp-title").innerHTML = `${leagueLogo(id, "md")}<a href="${SITE}/league/${esc(data.league?.url_name || "x")}/${esc(id)}" target="_blank" rel="noopener">${esc(data.league?.name || id)}</a>`;
  // rounds: promiedos lists every matchday; the selected one (with games inlined) is the current one.
  // If it is already fully played, show the next one.
  const rounds = (data.games?.filters || []).filter(f => f.key !== "latest");
  let idx = Math.max(0, rounds.findIndex(f => f.selected || f.games));
  const cur = rounds[idx];
  if (cur?.games?.length && cur.games.every(g => statusInfo(g).kind === "finished") && idx < rounds.length - 1) idx++;
  compView = { id, data, rounds, idx };
  const stats = data.players_statistics?.tables || [];
  const byKey = key => stats.find(t => t.columns?.some(c => c.key === key));
  const tables = compTables(id, data);
  const leaders = leaderTable("Top scorers", byKey("Goals"), "Goals") + leaderTable("Top assists", byKey("Assists"), "Assists");
  body.innerHTML = `<div class="comp-grid">
    <div><h4><button class="icon" data-round="-1" title="Previous matchday">‹</button><span class="grow" id="comp-round-name" style="text-align:center"></span>
      <button class="icon" data-round="1" title="Next matchday">›</button></h4><div id="comp-round"></div></div>
    <div><h4>Standings</h4><div class="tables">${tables || '<div class="muted">No table for this competition (knockout).</div>'}</div></div>
    <div>${leaders || '<h4>Leaders</h4><div class="muted">No player stats.</div>'}</div>
  </div>`;
  renderCompRound();
}

compDlg.addEventListener("click", e => {
  if (e.target === compDlg || e.target.closest("[data-close]")) return compDlg.close();
  const nav = e.target.closest("[data-round]");
  if (nav && compView) {
    const next = compView.idx + +nav.dataset.round;
    if (next >= 0 && next < compView.rounds.length) { compView.idx = next; renderCompRound(); }
  }
});
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-comp]");
  if (!chip) return;
  e.preventDefault();
  openCompetition(chip.dataset.comp);
});

// ---------- Manage panel ----------
const dlg = document.getElementById("manage-dlg");
let settingsDirty = false;
const squadCache = new Map();

const squadNames = teamId => cached(squadCache, teamId, () => api(`/team/${teamId}`).then(d => (d.squad?.groups || [])
  .filter(g => !/direcci/i.test(g.name))
  .flatMap(g => g.rows.map(r => r.entity?.object?.name).filter(Boolean))));

function settingsChanged() { saveTeams(); settingsDirty = true; renderManage(); }

function manageRow(t) {
  return `<div class="m-team" data-team="${esc(t.id)}">
    <div class="m-team-head">${teamLogo(t.id)}<span class="grow">${esc(t.name)}</span>
      <button class="icon danger" data-remove-team title="${t.followTeam ? "Stop following this team" : "Stop following these players"}">✕</button></div>
    <div class="m-players">
      ${t.players.map((p, i) => `<span class="m-pchip">★ ${esc(p)}<button class="icon danger" data-remove-player="${i}" title="Remove">✕</button></span>`).join("")}
      <form><input type="text" placeholder="+ follow a player" autocomplete="off" autocapitalize="words" enterkeyhint="done"></form>
      <div class="m-sugg" hidden></div>
    </div>
  </div>`;
}

function renderManage() {
  const all = [...followed.values()];
  document.getElementById("m-teams").innerHTML = all.filter(t => t.followTeam).map(manageRow).join("")
    || `<div class="muted">None yet.</div>`;
  document.getElementById("m-players").innerHTML = all.filter(t => !t.followTeam).map(manageRow).join("")
    || `<div class="muted">None yet. Search a team below and choose “+ Player”.</div>`;
}

const mBody = dlg.querySelector(".dlg-body");
mBody.addEventListener("click", e => {
  const box = e.target.closest("[data-team]");
  if (!box) return;
  const t = followed.get(box.dataset.team);
  const rmPlayer = e.target.closest("[data-remove-player]");
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    addPlayer(t, pick.dataset.pick);
    return;
  }
  if (e.target.closest("[data-remove-team]")) {
    // a followed team with tracked players keeps them, moving to the players row
    if (t.followTeam && t.players.length) t.followTeam = false;
    else followed.delete(t.id);
  } else if (rmPlayer) {
    t.players.splice(+rmPlayer.dataset.removePlayer, 1);
    if (!t.followTeam && !t.players.length) followed.delete(t.id);
  } else return;
  settingsChanged();
});
// Own suggestion list instead of <datalist>, which most mobile browsers don't show.
async function showPlayerSuggestions(input) {
  const box = input.closest("[data-team]");
  const out = box.querySelector(".m-sugg");
  const q = norm(input.value.trim());
  if (!q) { out.hidden = true; out.innerHTML = ""; return; }
  let names = [];
  try { names = await squadNames(box.dataset.team); } catch { /* free text still works */ }
  if (norm(input.value.trim()) !== q) return; // user kept typing
  const t = followed.get(box.dataset.team);
  const hits = names.filter(n => norm(n).includes(q) && !t.players.some(p => samePlayer(p, n)))
    .sort((a, b) => norm(a).indexOf(q) - norm(b).indexOf(q) || a.length - b.length).slice(0, 8);
  out.innerHTML = hits.map(n => `<button type="button" data-pick="${esc(n)}">+ ${esc(n)}</button>`).join("");
  out.hidden = !hits.length;
}
function addPlayer(t, name) {
  if (!t.players.some(p => norm(p) === norm(name))) t.players.push(name);
  settingsChanged();
  focusPlayerInput(t.id);
}
mBody.addEventListener("focusin", e => {
  const box = e.target.closest("[data-team]");
  if (box && e.target.tagName === "INPUT") squadNames(box.dataset.team).catch(() => {}); // prefetch
});
mBody.addEventListener("input", e => {
  if (e.target.closest("[data-team]") && e.target.tagName === "INPUT") showPlayerSuggestions(e.target);
});
mBody.addEventListener("submit", e => {
  e.preventDefault();
  const box = e.target.closest("[data-team]");
  if (!box) return;
  const name = e.target.querySelector("input").value.trim();
  if (name) addPlayer(followed.get(box.dataset.team), name);
});
const focusPlayerInput = id => dlg.querySelector(`[data-team="${CSS.escape(id)}"] input`)?.focus();

// Team search: promiedos has no search endpoint, so we index the teams of the leagues in CFG.searchLeagues.
let teamIndexPromise = null;
function teamIndex() {
  const saved = storageGet(STORE_INDEX);
  if (saved && Date.now() - saved.ts < INDEX_MAX_AGE) return Promise.resolve(saved.teams);
  if (teamIndexPromise) return teamIndexPromise;
  const status = document.getElementById("m-search-status");
  const leagues = CFG.searchLeagues || [];
  let done = 0;
  status.textContent = `Building team index… 0/${leagues.length} leagues`;
  teamIndexPromise = Promise.all(leagues.map(id => leagueTables(id).then(d => {
    const league = d.league?.name || "";
    const found = new Map();
    for (const g of d.tables_groups || []) for (const t of g.tables || []) for (const r of t.table?.rows || []) {
      const o = r.entity?.object;
      if (o?.id) found.set(o.id, [o.id, o.name, league]);
    }
    for (const f of d.games?.filters || []) for (const g of f.games || []) for (const o of g.teams || [])
      if (o.id && !found.has(o.id)) found.set(o.id, [o.id, o.name, league]);
    return [...found.values()];
  }).catch(() => []).finally(() => {
    status.textContent = `Building team index… ${++done}/${leagues.length} leagues`;
  }))).then(lists => {
    const byId = new Map();
    lists.flat().forEach(t => { if (!byId.has(t[0])) byId.set(t[0], t); });
    const teams = [...byId.values()];
    storageSet(STORE_INDEX, { ts: Date.now(), teams });
    status.textContent = "";
    teamIndexPromise = null;
    return teams;
  });
  return teamIndexPromise;
}

function addFollow(id, name, asTeam) {
  const t = followed.get(id) || { ...normalizeTeam({ id, name, followTeam: asTeam }), collapsed: true };
  if (asTeam) t.followTeam = true;
  followed.set(id, t);
  document.getElementById("m-search").value = "";
  document.getElementById("m-results").innerHTML = "";
  settingsChanged();
  if (!asTeam) focusPlayerInput(id);
}

function resultRow(id, name, meta) {
  const t = followed.get(id);
  return `<div class="result" data-id="${esc(id)}" data-name="${esc(name)}">${teamLogo(id)}<span>${esc(name)}</span>
    <span class="meta">${esc(meta)}</span>
    <button data-add="team" ${t?.followTeam ? "disabled" : ""}>${t?.followTeam ? "Following" : "+ Team"}</button>
    <button data-add="player">+ Player</button></div>`;
}

async function runSearch() {
  const input = document.getElementById("m-search");
  const q = input.value.trim();
  const out = document.getElementById("m-results");
  const status = document.getElementById("m-search-status");
  const urlId = /\/team\/[^/]+\/([a-z0-9]+)/i.exec(q)?.[1];
  if (urlId) {
    try {
      const d = await api(`/team/${urlId}`);
      out.innerHTML = resultRow(urlId, d.competitor?.name || urlId, d.main_league?.name || "");
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    return;
  }
  if (q.length < 2) { out.innerHTML = ""; status.textContent = ""; return; }
  const teams = await teamIndex();
  if (input.value.trim() !== q) return; // user kept typing
  const nq = norm(q);
  const hits = teams.filter(t => norm(t[1]).includes(nq))
    .sort((a, b) => norm(a[1]).indexOf(nq) - norm(b[1]).indexOf(nq) || a[1].length - b[1].length).slice(0, 15);
  status.textContent = hits.length ? "" : "No match in the indexed leagues. Paste the team's promiedos URL instead.";
  out.innerHTML = hits.map(([id, name, league]) => resultRow(id, name, league)).join("");
}

let searchTimer;
document.getElementById("m-search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 200); });
document.getElementById("m-results").addEventListener("click", e => {
  const b = e.target.closest("[data-add]");
  if (!b) return;
  const r = b.closest(".result");
  addFollow(r.dataset.id, r.dataset.name, b.dataset.add === "team");
});
document.getElementById("m-copy").addEventListener("click", async e => {
  const btn = e.currentTarget;
  const snippet = "  teams: [\n" + [...followed.values()].map(t =>
    `    { id: ${JSON.stringify(t.id)}, name: ${JSON.stringify(t.name)}${t.followTeam ? "" : ", followTeam: false"}${t.players.length ? `, players: ${JSON.stringify(t.players)}` : ""} },`).join("\n") + "\n  ],";
  try { await navigator.clipboard.writeText(snippet); btn.textContent = "Copied ✓"; }
  catch { prompt("Copy this into config.js:", snippet); }
  setTimeout(() => { btn.textContent = "Copy settings"; }, 2000);
});
document.getElementById("m-reset").addEventListener("click", () => {
  if (!confirm("Discard the teams and players added here and go back to config.js?")) return;
  storageSet(STORE_TEAMS, null); // card order and collapsed cards are kept
  loadTeams();
  settingsDirty = true;
  renderManage();
});
// Export / import: a JSON backup of the teams and players (the list in effect, even if it comes from config.js),
// card layout, folded sections and the selected rivals team.
document.getElementById("m-export").addEventListener("click", () => {
  const backup = {
    app: "futbol-tracker", version: 1, exported: new Date().toISOString(),
    teams: [...followed.values()].map(normalizeTeam),
    layout: storageGet(STORE_LAYOUT), foldedSections: storageGet(STORE_FOLDED), rivalOf: storageGet(STORE_RIVAL_OF),
    nextDays: storageGet(STORE_NEXT_DAYS),
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `futbol-tracker-settings-${apiDate(new Date())}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
const importInput = document.getElementById("m-import-file");
document.getElementById("m-import").addEventListener("click", () => importInput.click());
importInput.addEventListener("change", async () => {
  const file = importInput.files[0];
  importInput.value = "";
  if (!file) return;
  let backup;
  try {
    backup = JSON.parse(await file.text());
    if (backup?.app !== "futbol-tracker" || !Array.isArray(backup.teams) || backup.teams.some(t => !t?.id || !t?.name))
      throw new Error("not a Fútbol Tracker settings file");
  } catch (e) { alert(`Couldn't import ${file.name}: ${e.message}`); return; }
  if (!confirm(`Replace the current teams and players with the ${backup.teams.length} in ${file.name}?`)) return;
  const teams = backup.teams.map(normalizeTeam);
  storageSet(STORE_TEAMS, teamsSignature(teams) === CONFIG_SIGNATURE ? null : { base: CONFIG_SIGNATURE, teams });
  if (backup.layout) storageSet(STORE_LAYOUT, backup.layout);
  if (Array.isArray(backup.foldedSections)) storageSet(STORE_FOLDED, backup.foldedSections);
  if (backup.rivalOf !== undefined) storageSet(STORE_RIVAL_OF, backup.rivalOf);
  if (backup.nextDays != null) storageSet(STORE_NEXT_DAYS, backup.nextDays);
  location.reload();
});

document.getElementById("manage").addEventListener("click", () => { renderManage(); dlg.showModal(); });
dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) dlg.close(); });
dlg.addEventListener("close", () => {
  if (!settingsDirty) return;
  settingsDirty = false;
  teamDataCache.clear(); // player lists changed, so cards are rebuilt (fetches are mostly cached)
  resolvedTeamData.clear();
  renderTeams().then(refreshRivalViews);
});

// ---------- wiring ----------
async function loadAll() {
  document.getElementById("updated").textContent = "Updating…";
  for (const c of [gamecenterCache, leagueCache, teamDataCache, roundCache]) c.clear();
  todayGamesPromise = null;
  const teamsDone = renderTeams();
  renderNext();
  // the day view shows right away; standings and rival highlighting follow once team positions are known
  await Promise.all([teamsDone, renderDay()]);
  await refreshRivalViews();
  const n = new Date();
  document.getElementById("updated").textContent = `Updated ${pad(n.getHours())}:${pad(n.getMinutes())}`;
}

document.getElementById("config-banner").addEventListener("click", e => {
  const b = e.target.closest("[data-config]");
  if (!b) return;
  if (b.dataset.config === "use") storageSet(STORE_TEAMS, null);
  else storageSet(STORE_TEAMS, { ...storageGet(STORE_TEAMS), base: CONFIG_SIGNATURE }); // keep: stop asking until config.js changes again
  loadTeams();
  resolvedTeamData.clear();
  renderTeams().then(refreshRivalViews);
});

loadTeams();
document.getElementById("show-rivals").checked = false; // off on every page load
document.getElementById("show-rivals").addEventListener("change", renderDay);
document.querySelectorAll(".day-nav [data-shift]").forEach(b => b.addEventListener("click", () => {
  const s = +b.dataset.shift;
  dayOffset = s === 0 ? 0 : dayOffset + s;
  renderDay();
}));
document.getElementById("refresh").addEventListener("click", loadAll);
if (CFG.refreshSeconds > 0) setInterval(() => { if (!document.hidden && !dlg.open && !compDlg.open) loadAll(); }, CFG.refreshSeconds * 1000);
loadAll();
</script>
